    else if(c==='"') q=true;
    else if(c===delim){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cur);rows.push(row);row=[];cur=""; }
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function boardFrom(rows){
  const t=[],c=[],cats=[],ix={};
  (rows[0]||[]).forEach((h,col)=>{
    const name=String(h??"").trim();if(!name)return;
    for(let r=1;r<rows.length;r++){
      const v=String(rows[r][col]??"").trim();if(!v)continue;
      if(!(name in ix)){ix[name]=cats.length;cats.push(name);}
      t.push(v);c.push(ix[name]);
    }
  });
  return{t,c,cats,seed:Math.floor(Math.random()*2147483647)};
}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- game state (rebuilt from everyone's moves) ---------- */
function setBoard(b){
  board=b;items=b.t.map((t,i)=>({t,c:b.c[i]}));cats=b.cats;
  totals=cats.map(()=>0);items.forEach(it=>totals[it.c]++);
  const r=rng(b.seed);order=items.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  slot=[];order.forEach((i,p)=>{slot[i]=p;});
  mine={m:[],x:0};others={};sel=[];
  try{localStorage.setItem("gg_board",JSON.stringify(b));localStorage.setItem("gg_moves",JSON.stringify(mine));}catch(e){}
  const sizes=[...new Set(totals)];
  $("title").textContent=sizes.length===1?`Make ${cats.length} groups of ${sizes[0]}!`:`Make ${cats.length} groups!`;
  rebuild();
}
function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
function rebuild(){
  parent=items.map((_,i)=>i);score=0;mist=0;
  const sl=slot.slice(),ev=[];
  const gather=(p,id)=>{mist+=p.x||0;const m=p.m||[];for(let k=0;k+2<m.length;k+=3)ev.push([m[k+2],id,k,m[k],m[k+1]]);};
  gather(mine,me);Object.entries(others).forEach(([id,p])=>gather(p,id));
  ev.sort((x,y)=>x[0]-y[0]||(x[1]<y[1]?-1:x[1]>y[1]?1:0)||x[2]-y[2]);
  ev.forEach(e=>{
    const a=e[3],b=e[4];
    if(!items[a]||!items[b]||items[a].c!==items[b].c)return;
    const ra=find(a),rb=find(b);
    if(ra!==rb){parent[ra]=rb;delete sl[ra];score++;}
  });
  const by=new Map();units=[];
  for(let i=0;i<items.length;i++){const r=find(i);let u=by.get(r);if(!u){u={root:r,ids:[],slot:sl[r]};by.set(r,u);units.push(u);}u.ids.push(i);}
  units.forEach(u=>{u.done=u.ids.length===totals[items[u.ids[0]].c];});
  units.sort((a,b)=>a.slot-b.slot);
  umap=by;
  if(sel.length===2&&find(sel[0])===find(sel[1]))sel=[];
  render();
}
function click(i){
  const r=find(i),u=umap.get(r);
  if(!u||u.done)return;
  const k=sel.findIndex(s=>find(s)===r);
  if(k>-1){sel.splice(k,1);return render();}
  sel.push(i);
  if(sel.length<2)return render();
  const [a,b]=sel;sel=[];
  if(items[a].c===items[b].c)mine.m.push(a,b,Date.now());
  else{mine.x++;shake.add(find(a));shake.add(find(b));}
  save();rebuild();
}
function render(){
  $("score").textContent=score;$("mist").textContent=mist;
  const frag=document.createDocumentFragment();
  units.forEach(u=>{
    const d=document.createElement("div");
    d.dataset.i=u.ids[0];
    d.className="u"+(u.ids.length>1?" g":"")+(u.done?" done":"")+(sel.some(s=>find(s)===u.root)?" sel":"")+(shake.has(u.root)?" shake":"");
    if(u.ids.length===1)d.textContent=items[u.ids[0]].t;
    else{
      const names=u.ids.map(i=>items[i].t);
      d.title=names.join(", ");
      const b=document.createElement("b");b.textContent=u.done?cats[items[u.ids[0]].c]+" ("+u.ids.length+")":"×"+u.ids.length;
      d.appendChild(b);
      const s=document.createElement("small");
      s.textContent=u.done?names.join(", "):names.slice(0,3).join(", ")+(names.length>3?"…":"");
      d.appendChild(s);
    }
    frag.appendChild(d);
  });
  shake.clear();
  const g=$("grid");g.textContent="";g.appendChild(frag);
  const all=units.length>0&&units.every(u=>u.done);
  if(all)note(`All groups found with ${mist} mistake${mist===1?"":"s"}. Nicely done!`);
  else if($("msg").style.color==="")note("");
}
$("grid").onclick=e=>{const d=e.target.closest(".u");if(d)click(+d.dataset.i);};

/* ---------- sharing (one doc of moves per player, so nobody overwrites anybody) ---------- */
let saving=false,dirty=false;
async function save(){
  if(!shared){try{localStorage.setItem("gg_moves",JSON.stringify(mine));}catch(e){}return;}
  dirty=true;if(saving)return;saving=true;
  while(dirty){
    dirty=false;
    try{await db.doc(`games/${gid}/moves/${me}`).set({m:mine.m,x:mine.x,t:Date.now()});}
    catch(e){note("Couldn’t save your move to the shared game (view-only access?).",true);}
  }
  saving=false;
}
async function loadGame(g){
  if(unsubMoves){unsubMoves();unsubMoves=null;}
  gid=g;shared=true;status("Shared game: everyone sees the same board");
  const s=await db.doc("games/"+g).get();
  if(gid!==g||!s.exists)return;
  const meta=s.data();
  const parts=await Promise.all(Array.from({length:meta.parts},(_,k)=>db.doc(`games/${g}/parts/${k}`).get()));
  if(gid!==g)return;
  const t=[],c=[];
  parts.forEach(p=>{const d=p.data()||{};(d.t||[]).forEach((x,i)=>{t.push(x);c.push(d.c[i]);});});
  setBoard({t,c,cats:meta.cats,seed:meta.seed});
  unsubMoves=db.collection(`games/${g}/moves`).onSnapshot(q=>{
    others={};q.docs.forEach(d=>{if(d.id!==me)others[d.id]=d.data();});rebuild();
  },()=>status("Lost the connection to the shared game"));
}
async function newGame(b){
  if(!b.t.length)throw new Error("empty");
  if(!db){gid=null;shared=false;return setBoard(b);}
  const g=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{
    const parts=[],enc=new TextEncoder();let cur={t:[],c:[]},size=0;
    b.t.forEach((x,i)=>{const n=enc.encode(x).length+8;if(size+n>150000&&cur.t.length){parts.push(cur);cur={t:[],c:[]};size=0;}cur.t.push(x);cur.c.push(b.c[i]);size+=n;});
    parts.push(cur);
    await Promise.all(parts.map((p,k)=>db.doc(`games/${g}/parts/${k}`).set(p)));
    await db.doc("games/"+g).set({cats:b.cats,seed:b.seed,parts:parts.length});
    await db.doc("meta/current").set({gid:g});
  }catch(e){
    note("Couldn’t share the new game (view-only access?). Playing solo.",true);
    shared=false;gid=null;if(unsubMoves){unsubMoves();unsubMoves=null;}
    setBoard(b);status("Solo mode: progress isn’t shared");
  }
}

/* ---------- controls ---------- */
$("desel").onclick=()=>{sel=[];render();};
let armed=0;
$("again").onclick=()=>{
  const btn=$("again");
  if(!armed){armed=setTimeout(()=>{armed=0;btn.textContent="Restart";},3000);btn.textContent="Click again to confirm";return;}
  clearTimeout(armed);armed=0;btn.textContent="Restart";
  newGame({...board,seed:Math.floor(Math.random()*2147483647)});
};
$("sample").onclick=()=>newGame({...DEFAULT,seed:Math.floor(Math.random()*2147483647)});
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    let rows;
    if(/\.xlsx?$/i.test(f.name)){
      const wb=XLSX.read(await f.arrayBuffer());
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    }else rows=parseCSV(await f.text());
    note("");
    await newGame(boardFrom(rows));
  }catch(err){
    note(err.message==="big"?"That list is too large to share (limit about 240 KB of text). Try shorter item names.":"Couldn’t read that file. Use a header row of category names with items below each.",true);
  }
  e.target.value="";
};

/* ---------- start ---------- */
(function(){
  try{
    const b=JSON.parse(localStorage.getItem("gg_board")||"null");
    const m=JSON.parse(localStorage.getItem("gg_moves")||"null");
    if(b&&b.t&&b.t.length&&(!b.id||b.id===DEFAULT.id)){
      setBoard(b);
      if(m&&Array.isArray(m.m)){mine=m;rebuild();localStorage.setItem("gg_moves",JSON.stringify(mine));}
      return;
    }
  }catch(e){}
  setBoard({...DEFAULT,seed:Math.floor(Math.random()*2147483647)});
})();
status("Single-player: progress is saved on this computer");
</script>
